name: Build USALAMA Agent APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Vérification du code
      uses: actions/checkout@v3

    - name: Configuration de Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Configuration de Java pour Android
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installation des dépendances NPM
      run: npm install

    - name: Installation de Capacitor
      run: |
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli

    - name: Compilation de l'interface Web (Vite)
      run: npm run build

    - name: Initialisation de la plateforme Android
      run: |
        npx cap add android
        npx cap sync android
        
    - name: Attribution des permissions Gradle
      run: chmod +x android/gradlew
      
    - name: Compilation de l'APK (Assemble Debug)
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: Publication de l'APK
      uses: actions/upload-artifact@v3
      with:
        name: USALAMA-Agent-v2.0
        path: android/app/build/outputs/apk/debug/app-debug.apk
