  <body style="min-height: 100vh;">
    <div id="error-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,0,0,0.9); z-index: 999999; color: white; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var str = 'Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\nError object: ' + JSON.stringify(error) + '\nStack: ' + (error && error.stack);
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').textContent += str + '\n\n';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var str = 'Unhandled promise rejection: ' + event.reason + '\nStack: ' + (event.reason && event.reason.stack);
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').textContent += str + '\n\n';
      });
    </script>
    <div id="root"></div>
